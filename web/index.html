<title>Selah Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Serif:wght@400;600&display=swap">
<style>
/* Layout: full-height app. Header (modes + breadcrumb), one main panel per mode, canon scrubber pinned at the bottom of Zoom mode. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#152033; --muted:#566377; --line:#d4dbe5;
  --lapis:#1f4fa8; --gold:#8a6212; --lapis-soft:#dfe7f6; --gold-soft:#f4e9d2;
  --g-law:#1f4fa8; --g-hist:#3a7d6b; --g-poet:#8a5aa8; --g-maj:#b4522f; --g-min:#d0874a;
  --g-gosp:#a8771a; --g-acts:#6d8a2c; --g-paul:#2f7fb4; --g-gen:#5b6fb8; --g-rev:#9b3557;
  --display:"Gloock", Georgia, serif; --body:"Figtree", system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, serif; --heb:"Noto Serif Hebrew", "SBL Hebrew", "Times New Roman", serif; --grk:"Noto Serif", "Gentium Plus", "Times New Roman", serif; --mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --surface:#141c2e; --ink:#e6ebf3; --muted:#9aa6ba; --line:#26314a;
  --lapis:#7ea3ec; --gold:#e0b65c; --lapis-soft:#1b2a4a; --gold-soft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#141c2e; --ink:#e6ebf3; --muted:#9aa6ba; --line:#26314a;
  --lapis:#7ea3ec; --gold:#e0b65c; --lapis-soft:#1b2a4a; --gold-soft:#33291a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--display);font-size:1.35rem;line-height:1}
.modes{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.modes button{border:0;background:transparent;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.modes button:active,.btn:active,.chip:active{transform:scale(.95)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.85rem;font-weight:500;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{border-color:var(--lapis)}
.btn[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--surface)}
.chip{border:0;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;transition:transform .15s}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;width:100%;font-family:var(--mono);font-size:.8rem;min-width:0}
.crumbs button{border:0;background:transparent;padding:3px 6px;border-radius:6px;cursor:pointer;color:var(--lapis)}
.crumbs button:hover{background:var(--lapis-soft)}
.crumbs button:last-child{color:var(--ink);font-weight:500}
.crumbs .sep{color:var(--muted)}
main{position:relative;min-height:0}
.panel{position:absolute;inset:0}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.view{position:absolute;inset:0;overflow-y:auto;padding-inline:16px;padding-block:20px 40px;will-change:transform,opacity}
.inner{max-width:980px;margin:0 auto;display:grid;gap:18px}
.vhead{display:grid;gap:4px}
.vhead h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.1;margin:0;text-wrap:balance}
.vhead p{margin:0;color:var(--muted);max-width:70ch}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hint{font-size:.8rem;color:var(--muted)}
.zoombar{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:5}
.zoombar .btn{width:38px;height:38px;padding:0;font-size:1.1rem;border-radius:50%;box-shadow:0 2px 8px rgb(0 0 0/.12)}
/* Canon */
.testament{font-family:var(--display);font-size:1.2rem;margin:6px 0 -6px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px;align-content:start;cursor:zoom-in;transition:transform .2s cubic-bezier(.3,1.6,.4,1),border-color .2s}
.book:hover{transform:translateY(-2px);border-color:var(--c)}
.book .bn{font-weight:600;font-size:.85rem;display:flex;justify-content:space-between;gap:6px}
.book .bn span{font-family:var(--mono);font-weight:400;font-size:.7rem;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--c);opacity:.28;transition:transform .15s,opacity .15s}
.dots i.r{opacity:1}
.dots i:hover{transform:scale(1.9);opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
/* Book */
.chbars{display:flex;align-items:flex-end;gap:3px;height:180px;overflow-x:auto;padding-bottom:22px}
.chbars button{flex:1 0 12px;min-width:12px;border:0;padding:0;background:var(--c);opacity:.55;border-radius:3px 3px 0 0;cursor:zoom-in;position:relative;transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.4,1)}
.chbars button.r{opacity:.9}
.chbars button:hover{opacity:1;transform:scaleY(1.06);transform-origin:bottom}
.chbars button span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:.6rem var(--mono);color:var(--muted)}
.conn{display:grid;gap:6px}
.conn button{display:grid;grid-template-columns:130px 1fr 50px;gap:10px;align-items:center;border:0;background:transparent;cursor:pointer;text-align:left;padding:3px 0}
.conn .bar{height:10px;border-radius:5px;background:var(--c);transform-origin:left;transition:transform .2s}
.conn button:hover .bar{transform:scaleY(1.5)}
.conn .n{font:.75rem var(--mono);color:var(--muted);text-align:right}
/* Chapter */
.reading{font-family:var(--read);font-size:1.15rem;line-height:1.85;max-width:68ch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.vs{display:block;cursor:zoom-in;border-radius:6px;padding:3px 8px;margin:0 -8px;transform-origin:left center;transition:transform .4s cubic-bezier(.3,1.5,.4,1),color .3s,opacity .3s,background .2s}
.vs:hover{background:var(--lapis-soft)}
.reading.focusing .vs:not(.focus){opacity:.62}
.vs.focus{transform:scale(1.035);color:var(--lapis)}
.vs.focus sup{color:var(--gold)}
.view.wide .inner{max-width:1360px}
.chapwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,700px) minmax(0,1fr);gap:18px;align-items:start;will-change:transform}
.chapmid{display:grid;gap:18px;min-width:0}
.peek{position:sticky;top:8px;height:min(66vh,620px);border:1px dashed var(--line);border-radius:14px;padding:16px;overflow:hidden;cursor:pointer;opacity:.5;background:var(--surface);display:grid;align-content:start;gap:8px;text-align:left;font-family:var(--read);color:var(--muted);font-size:.85rem;line-height:1.6;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);transition:opacity .25s,transform .4s cubic-bezier(.3,1.6,.4,1),border-color .25s}
.peek:hover,.peek:focus-visible{opacity:1;border-color:var(--lapis)}
.peek.prev:hover{transform:translateX(6px)}.peek.next:hover{transform:translateX(-6px)}
.peek h3{font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--ink);margin:0}
.peek .arrow{font:500 .72rem var(--mono);color:var(--lapis);letter-spacing:.06em;text-transform:uppercase}
.peek p{margin:0}
.peek.empty{visibility:hidden}
.listen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;position:sticky;top:8px;z-index:3;box-shadow:0 4px 14px rgb(0 0 0/.08)}
.listen .play{background:var(--lapis);border-color:var(--lapis);color:var(--surface);font-weight:600;min-width:96px}
.listen .play.on{background:var(--gold);border-color:var(--gold)}
.listen select{font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0;max-width:100%}
.listen select#voiceSel{flex:1 1 180px}
.listen .note{font-size:.75rem;color:var(--muted);width:100%}
.listen .note a{color:var(--lapis)}
.vs.speaking{background:var(--lapis-soft)}
.acc{display:flex;gap:6px;align-items:flex-start;justify-content:center;will-change:transform}
.pane{min-width:0;transition:flex-basis .48s cubic-bezier(.65,0,.25,1)}
.pane.open{flex:1 1 0;max-width:760px;display:grid;gap:18px;transition:flex-basis .48s cubic-bezier(.65,0,.25,1),opacity .3s}
.pane.open.collapsing{overflow:hidden;height:min(72vh,660px)}
.pane.open.collapsing>*{opacity:0;transition:opacity .2s}
.pane.strip{flex:0 0 var(--sw,52px);position:sticky;top:8px;height:min(72vh,660px);border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;color:var(--muted);transition:flex-basis .48s cubic-bezier(.65,0,.25,1),background .2s,border-color .2s,color .2s}
.pane.strip:hover,.pane.strip:focus-visible{background:var(--lapis-soft);border-color:var(--lapis);color:var(--ink)}
.pane.strip .sl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:1.05rem;white-space:nowrap;color:inherit}
.pane.strip .sn{font:600 .72rem var(--mono);color:var(--gold)}
.pane.strip .sb{flex:1;width:4px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.pane.strip .sb i{position:absolute;left:0;right:0;bottom:0;background:var(--c);border-radius:4px}
.pane.strip.r .sn::after{content:" ✓";color:var(--lapis)}
.pane.strip.expanding{align-items:stretch;padding:18px 22px;cursor:default;background:var(--surface);border-color:var(--line)}
.pane.strip .pv{display:grid;gap:10px;text-align:left;min-width:min(60vw,640px);animation:pvIn .4s ease .1s both}
.pane.strip .pv h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.6rem);margin:0;color:var(--ink)}
.pane.strip .pv p{margin:0;font-family:var(--read);font-size:1.1rem;line-height:1.8;color:var(--ink)}
@keyframes pvIn{from{opacity:0}to{opacity:1}}
@media (max-width:700px){.pane.strip{--sw:38px}.pane.strip .sl{font-size:.9rem}}
.upnext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.upnext .btn{padding:10px 16px;font-size:.95rem}
@media (max-width:1000px){.chapwrap{grid-template-columns:40px minmax(0,1fr) 40px;gap:8px}.peek{padding:12px 0;writing-mode:vertical-rl;place-items:center;align-content:center;-webkit-mask-image:none;mask-image:none;opacity:.8}.peek p{display:none}.peek h3{font-size:1rem}.peek.prev{transform:rotate(180deg)}.peek.prev:hover{transform:rotate(180deg) translateY(4px)}}
.vs sup{font:600 .62rem var(--mono);color:var(--lapis);margin-right:3px;vertical-align:super}
.vs sup.hot{color:var(--gold)}
.vs.flash{animation:flash 2.2s ease}
@keyframes flash{0%,30%{background:var(--gold-soft)}100%{background:transparent}}
.navrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Verse */
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 28px;display:grid;gap:12px;transition:transform .25s ease-out;transform-style:preserve-3d}
.vtext{font-family:var(--read);font-size:clamp(1.3rem,3vw,1.85rem);line-height:1.5}
.w{cursor:zoom-in;border-radius:4px;transition:background .15s,color .15s}
.w:hover{background:var(--gold-soft);color:var(--gold)}
.interlin{display:flex;flex-wrap:wrap;gap:8px}
.interlin.rtl{direction:rtl}
.iw{display:grid;gap:1px;justify-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:zoom-in;min-width:62px;transition:transform .25s cubic-bezier(.3,1.6,.4,1),border-color .2s,background .2s}
.iw:hover,.iw:focus-visible{transform:translateY(-3px) scale(1.05);border-color:var(--gold);background:var(--gold-soft)}
.iw .o{font-size:1.45rem;line-height:1.3}
.heb{font-family:var(--heb)}.grk{font-family:var(--grk)}
.iw .t{font:.7rem var(--mono);color:var(--lapis);direction:ltr}
.iw .g{font-size:.78rem;color:var(--muted);direction:ltr;max-width:14ch}
.iw .s{font:.6rem var(--mono);color:var(--gold);direction:ltr}
.lemma{font-size:clamp(3rem,10vw,5.5rem);line-height:1.15}
.btn.hear{margin:6px 0 2px}.btn.hear.playing{background:var(--gold-soft);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px}
.chips b{font-weight:600;color:var(--gold)}
.def{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-line;font-size:.92rem;max-height:13em;overflow:hidden;position:relative}
.def.open{max-height:none}
.xrefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.xr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:transform .2s cubic-bezier(.3,1.6,.4,1),border-color .2s}
.xr:hover{transform:translateY(-2px);border-color:var(--lapis)}
.xr b{font:500 .78rem var(--mono);color:var(--lapis);display:flex;justify-content:space-between}
.xr b span{color:var(--muted);font-weight:400}
.xr p{margin:0;font-family:var(--read);font-size:.92rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Word */
.bigword{font-family:var(--display);font-size:clamp(3rem,10vw,6rem);line-height:1}
.strip{width:100%;height:56px;display:block;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.occ{display:grid;gap:6px}
.occ button{border:0;background:transparent;text-align:left;cursor:pointer;padding:6px 8px;border-radius:8px;display:grid;grid-template-columns:110px 1fr;gap:10px;font-family:var(--read);font-size:.95rem}
.occ button:hover{background:var(--lapis-soft)}
.occ button b{font:500 .75rem var(--mono);color:var(--lapis);padding-top:3px}
.occ mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}
/* Scrubber */
.scrub{position:relative;padding:8px 16px 10px;border-top:1px solid var(--line);background:var(--surface)}
.scrub canvas{display:block;width:100%;height:34px;cursor:ew-resize;touch-action:none;border-radius:6px}
.scrub .lbl{display:flex;justify-content:space-between;font:.68rem var(--mono);color:var(--muted);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.tip{position:absolute;bottom:62px;width:min(340px,80vw);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:.85rem;pointer-events:none;box-shadow:0 6px 20px rgb(0 0 0/.25);z-index:10}
.tip b{font-family:var(--mono);font-size:.75rem;display:block;color:var(--gold)}
/* Galaxy */
#galaxy canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.gpanel{position:absolute;left:14px;top:14px;max-width:min(320px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;box-shadow:0 4px 16px rgb(0 0 0/.08)}
.gpanel h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem}
.gpanel p{margin:0;font-size:.85rem;color:var(--muted)}
.glabel{position:absolute;pointer-events:none;font:600 .78rem var(--body);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 7px;transform:translate(-50%,-150%);white-space:nowrap}
.gbook{position:absolute;left:0;top:0;pointer-events:none;font:500 .72rem var(--body);white-space:nowrap;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg);will-change:transform}
.tstage{width:min(900px,100%);display:grid;gap:12px;text-align:center}
.thead{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px}
.thead h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem}
.tarc{width:100%;height:170px;display:block}
.tcount{font:500 .78rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ttarget{font-family:var(--display);font-size:clamp(2rem,6vw,3.6rem);line-height:1;color:var(--c,var(--ink))}
.ttarget.pop{animation:pop .5s cubic-bezier(.3,1.6,.4,1)}
.tpairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;text-align:left}
.tpair{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;gap:4px;font-family:var(--read);font-size:.86rem;color:var(--muted);transition:transform .2s cubic-bezier(.3,1.6,.4,1),border-color .2s}
.tpair:hover{transform:translateY(-2px);border-color:var(--lapis)}
.tpair b{font:500 .74rem var(--mono);color:var(--lapis)}
.tpair span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tram{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.tram button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.8rem;color:var(--c)}
.tram button:hover{border-color:var(--c)}
.gload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
/* Descent */
#descent{overflow-y:auto}
.dspace{position:relative}
.dsticky{position:sticky;top:0;display:grid;place-items:center;padding-inline:16px;overflow:hidden}
.dcore{width:min(760px,100%);display:grid;gap:14px;text-align:center}
.dcount{font-family:var(--display);font-size:clamp(2.6rem,9vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums}
.dcount small{display:block;font:500 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dbook{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.8rem);color:var(--c,var(--ink));transition:color .3s}
.dbook.pop{animation:pop .5s cubic-bezier(.3,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.8);opacity:.3}100%{transform:scale(1);opacity:1}}
.dref{font:.85rem var(--mono);color:var(--muted)}
.dtext{font-family:var(--read);font-size:clamp(1.05rem,2.4vw,1.35rem);min-height:4.5em;line-height:1.5}
.dgauge{position:absolute;right:18px;top:10%;bottom:10%;width:4px;border-radius:4px;background:var(--line)}
.dgauge i{position:absolute;left:-5px;width:14px;height:14px;border-radius:50%;background:var(--gold);transform:translateY(-50%)}
.dgauge span{position:absolute;right:14px;font:.65rem var(--mono);color:var(--muted);white-space:nowrap;transform:translateY(-50%)}
.dintro{position:absolute;top:24px;left:0;right:0;text-align:center;color:var(--muted);font-size:.85rem;padding-inline:40px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.85rem;z-index:50;max-width:calc(100% - 32px);text-align:center}
.loading{display:grid;place-items:center;height:100%;color:var(--muted);gap:8px;align-content:center}
@media (max-width:600px){.conn button{grid-template-columns:100px 1fr 40px}.reading{padding:16px}.vcard{padding:18px}.occ button{grid-template-columns:1fr}}
/* Reading plan: pop-up sheet on open, header chip, in-chapter bar */
#planChip{background:var(--lapis-soft);display:inline-flex;gap:6px;align-items:center}
#planChip.due::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.sheetbg{position:fixed;inset:0;background:rgb(8 12 22/.5);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:16px;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}}
.sheet{box-sizing:border-box;background:var(--surface);color:var(--ink);border-radius:20px;max-width:460px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 24px 70px rgb(0 0 0/.35);animation:rise .4s cubic-bezier(.2,1.2,.4,1)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;margin:4px 0 6px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.sheet .x{float:right;border:0;background:transparent;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.pstats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.pstats span{background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.8rem}
.pstats .fire{background:var(--gold-soft)}
.plist{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.plist button{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,transform .15s}
.plist button:hover{border-color:var(--c,var(--lapis))}
.plist button:active{transform:scale(.98)}
.plist .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--c,var(--lapis));display:grid;place-items:center;font-size:.7rem;color:var(--surface)}
.plist .done .ck{background:var(--c,var(--lapis))}
.plist .done .pn{color:var(--muted);text-decoration:line-through}
.plist .pn{font-family:var(--read);font-size:1.05rem}
.plist.compact{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}.plist.compact button{padding:7px 9px;gap:7px;grid-template-columns:18px 1fr}.plist.compact .ck{width:16px;height:16px}.plist.compact .pn{font-size:.92rem}.plist.compact small{display:none}
.plist small{font:.72rem var(--mono);color:var(--muted)}
.pbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lapis),var(--gold));border-radius:6px}
.pmeta{font:.72rem var(--mono);color:var(--muted);margin-bottom:14px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pacts .btn{padding:10px 14px;font-size:.92rem}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--surface);font-weight:600}
.plinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.82rem}
.plinks a,.plinks button{color:var(--lapis);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.82rem}
.cad{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin:8px 0 12px}
.cad button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.cad button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.pplans{display:grid;gap:8px;margin-bottom:12px}
.pplans button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;cursor:pointer}
.pplans button[aria-pressed="true"]{border-color:var(--lapis);box-shadow:0 0 0 2px var(--lapis-soft)}
.pplans b{display:block;font-size:.95rem}
.pplans span{font-size:.8rem;color:var(--muted)}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:.85rem}
.prow select,.prow input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.planbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border-radius:12px;padding:8px 12px;margin:0 0 14px;font-size:.85rem}
.planbar .pd{display:flex;gap:4px}
.planbar .pd i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold)}
.planbar .pd i.on{background:var(--gold)}
.planbar .btn{margin-left:auto}
.cele{font-size:2.6rem;line-height:1;margin-bottom:6px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@media (max-width:600px){.sheetbg{place-items:end center;padding:0}.sheet{border-radius:20px 20px 0 0;max-height:90%}}
/* Accessibility helpers */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:80;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600}
.skip:focus{top:8px}
h2[tabindex="-1"]:focus,.bigword[tabindex="-1"]:focus{outline:none}
#scrub:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.gjump{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
.gjump select,.trsel{font:inherit;font-size:.82rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%}
/* Translations */
.trrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.compare{display:grid;gap:8px}
.compare div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.compare b{font:600 .72rem var(--mono);color:var(--gold);letter-spacing:.08em;display:block;margin-bottom:2px}
.compare p{margin:0;font-family:var(--read);font-size:1.02rem;line-height:1.55}
.compare .cur{border-color:var(--lapis)}
/* Highlights, bookmarks and notes */
:root{--hl-gold:rgb(240 196 80/.35);--hl-green:rgb(110 190 120/.32);--hl-blue:rgb(110 160 240/.32);--hl-pink:rgb(236 120 170/.30)}
.vs.hl-gold,.vtext.hl-gold{background:var(--hl-gold)}.vs.hl-green,.vtext.hl-green{background:var(--hl-green)}
.vs.hl-blue,.vtext.hl-blue{background:var(--hl-blue)}.vs.hl-pink,.vtext.hl-pink{background:var(--hl-pink)}
.vs[class*="hl-"]{border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vs .mk{font-size:.72em;margin-left:2px;color:var(--gold);vertical-align:super}
.marks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.marks .ml{font-size:.78rem;color:var(--muted)}
.hl-sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--sw);cursor:pointer;padding:0}
.hl-sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.hl-sw.none{background:var(--surface);position:relative}
.hl-sw.none::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;background:var(--muted);transform:rotate(-45deg)}
.notebox{display:grid;gap:6px;margin-top:10px}
.notebox label{font-size:.78rem;color:var(--muted)}
.notebox textarea{font:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.notebox .row{display:flex;gap:8px}
.libtabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin:8px 0 12px}
.libtabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:.85rem}
.libtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.liblist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.liblist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:3px}
.liblist button:hover{border-color:var(--lapis)}
.liblist b{font:600 .78rem var(--mono);color:var(--gold)}
.liblist span{font-family:var(--read);font-size:.95rem;line-height:1.45}
.liblist em{font-style:normal;font-size:.85rem;color:var(--muted)}
.libempty{color:var(--muted);font-size:.9rem}
#libChip::before{content:"🔖";margin-right:4px}
@media (max-width:600px){.libtabs button{font-size:.74rem;padding:7px 3px;white-space:nowrap}#libChip,#findChip{font-size:0;padding:6px 7px;line-height:1}#libChip::before,#findChip::before{font-size:.95rem;margin:0}}
/* Time: timeline and linked map */
#time{overflow:auto}
.tl{display:grid;grid-template-rows:auto auto minmax(300px,1fr) auto;gap:10px;padding:12px 16px;min-height:100%;box-sizing:border-box;max-width:1500px;margin:0 auto}
.tl-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tl-title{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}
.tl-find{flex:1 1 220px;max-width:420px}
.tl-find input{width:100%;box-sizing:border-box;font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.tl-zoom{display:flex;gap:4px}
.tl-scroll{--evy:126px;--prow:146px;overflow:auto;max-height:44vh;border:1px solid var(--line);border-radius:14px;background:var(--surface);overscroll-behavior-x:contain;cursor:grab}
.tl-canvas{position:relative;min-height:220px}
.tl-era{position:absolute;top:0;height:22px;border-right:1px solid var(--surface);background:var(--lapis-soft);overflow:hidden;font-size:.68rem;color:var(--muted);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.tl-era{border:0;padding:0;cursor:zoom-in}.tl-era.alt{background:var(--gold-soft)}.tl-era:hover{filter:brightness(.95)}
.tl-tick{position:absolute;top:22px;bottom:0;border-left:1px dashed var(--line);pointer-events:none}
.tl-tick span{position:absolute;top:2px;left:4px;font:.62rem var(--mono);color:var(--muted);white-space:nowrap}
.tl-ev{position:absolute;transform:translateX(-5px);border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.tl-ev i{position:absolute;left:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}
.tl-ev:not(.lab){top:calc(var(--evy) - 5px);width:10px;height:10px}
.tl-ev.lab{top:calc(var(--evy) - 5px - (var(--r) + 1) * 18px);height:calc((var(--r) + 1) * 18px + 10px);width:10px}
.tl-ev.lab::before{content:"";position:absolute;left:4.5px;top:14px;bottom:9px;border-left:1px solid var(--line)}
.tl-ev span{position:absolute;left:-2px;top:0;white-space:nowrap;font-size:.72rem;line-height:14px;padding:0 4px;border-radius:4px;background:var(--surface)}
.tl-ev:hover span,.tl-ev.on span{background:var(--gold-soft)}
.tl-ev.on i{background:var(--lapis);transform:scale(1.5)}
.tl-p{position:absolute;height:18px;border-radius:9px;border:1px solid var(--lapis);background:var(--lapis-soft);padding:0 6px;cursor:pointer;overflow:visible;color:var(--ink);text-align:left}
.tl-p.out span{position:absolute;left:calc(100% + 4px);top:0}
.tl-p.active{border-style:dashed}
.tl-p span{display:inline-block;font-size:.7rem;white-space:nowrap;line-height:16px}
.tl-p.on{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.tl-lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:10px;min-height:0}
.tl-map{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:300px;background:var(--lapis-soft)}
.tl-map svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.tl-map .sea{fill:var(--lapis-soft)}
.tl-map .land{fill:var(--surface);stroke:var(--line);stroke-width:.4}
.tl-map .river{fill:none;stroke:var(--lapis);stroke-width:1.2;opacity:.45;vector-effect:non-scaling-stroke}
.tl-map .lake{fill:var(--lapis-soft);stroke:var(--lapis);stroke-width:.6;opacity:.8;vector-effect:non-scaling-stroke}
.tl-map circle{fill:var(--muted);opacity:.28;stroke:var(--surface);cursor:pointer;transition:opacity .3s,fill .3s}
.tl-map circle.now{fill:var(--gold);opacity:.85}
.tl-map circle.sel{fill:var(--g-rev);opacity:1}
.tl-map .route{fill:none;stroke:var(--g-rev);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;opacity:.8}
.tl-map text{fill:var(--ink);stroke:var(--surface);stroke-width:.25em;paint-order:stroke;font-family:var(--body);pointer-events:none}
.tl-map text.on{font-weight:700}
.tl-mapbtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.tl-detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow:auto;max-height:100%}
.tl-detail h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:2px 0 8px}
.tl-muted{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.tl-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.tl-chips b{font:600 .7rem var(--mono);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;width:100%}
.tl-chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.tl-chips button:hover{border-color:var(--lapis)}
.tl-note{font-size:.75rem;color:var(--muted);margin:0}
.sheet.search{max-width:620px}
.semform{display:flex;gap:8px;margin:6px 0 10px}
.semform input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.semscope{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.semscope button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.semscope button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.semstatus{color:var(--muted);font-size:.85rem;margin:4px 0 8px;min-height:1.2em}
.semex{display:flex;flex-wrap:wrap;gap:6px}
.semnote{color:var(--muted);font-size:.78rem;margin:12px 0 0}
#findChip::before{content:"🔍";margin-right:4px}
.zoombar #findFab{display:none}
@media (max-width:600px){#findChip{display:none}.zoombar #findFab{display:block;font-size:.95rem}}
/* Stories: guided journeys and explainers */
#stories{overflow:auto;--ph:600px}
.st-home,.st-x{max-width:980px;margin:0 auto;padding:18px 16px 40px;box-sizing:border-box}
.st-home h2:focus,.st-x h2:focus,.st-step h2:focus{outline:none}
.st-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-top:14px}
.st-card{display:grid;gap:6px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 16px 18px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .2s,border-color .2s;min-height:150px;position:relative;overflow:hidden}
.st-card:hover{transform:translateY(-2px);border-color:var(--lapis)}
.st-card b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.15}
.st-card span:last-child{color:var(--muted);font-size:.9rem}
.st-card::after{content:"";position:absolute;right:-18px;bottom:-18px;width:90px;height:90px;border-radius:50%;background:var(--lapis-soft);opacity:.7}
.st-card.plan::after{border-radius:8px;background:var(--gold-soft)}.st-card.ark::after{border-radius:14px 14px 40px 40px;width:130px;height:46px;bottom:-6px;background:var(--gold-soft)}
.st-back{display:block;margin-bottom:10px}
.st-j{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
.st-vis{position:sticky;top:0;height:var(--ph);padding:12px;box-sizing:border-box;z-index:1}
.st-vis svg{display:block;width:100%;height:100%;border-radius:14px;border:1px solid var(--line);background:var(--lapis-soft);box-sizing:border-box}
.st-vis .sea{fill:var(--lapis-soft)}.st-vis .land{fill:var(--surface);stroke:var(--line);stroke-width:calc(var(--u) * 1px)}
.st-vis path.j0,.st-vis path.all{stroke:var(--g-rev)}.st-vis path.j1{stroke:var(--lapis)}.st-vis path.j2{stroke:var(--g-acts)}.st-vis path.j3{stroke:var(--gold)}.st-vis path.j4{stroke:var(--g-rev)}
#stDone path,#stNow{fill:none;stroke-width:calc(var(--u) * 2.6px);stroke-linecap:round;stroke-linejoin:round}
#stDone path{opacity:.45}
#stNow{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.2s ease-in-out}
#stNow.all{stroke-dasharray:none;opacity:.8}
#stDots circle{fill:var(--muted);stroke:var(--surface);stroke-width:calc(var(--u) * 1.2px)}

#stLabels text{fill:var(--muted);stroke:var(--surface);stroke-width:.28em;paint-order:stroke;font-family:var(--body)}
#stLabels text.on{fill:var(--ink);font-weight:700}
.st-legend{position:absolute;left:22px;bottom:22px;display:flex;flex-wrap:wrap;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.72rem;max-width:calc(100% - 44px);box-sizing:border-box}

.st-legend .j1 i{background:var(--lapis)}.st-legend .j2 i{background:var(--g-acts)}.st-legend .j3 i{background:var(--gold)}
.st-steps{padding:calc(var(--ph) * .3) 16px calc(var(--ph) * .5) 8px;display:grid;gap:calc(var(--ph) * .42)}
.st-step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;opacity:.55;transition:opacity .4s,box-shadow .4s}
.st-step.cur,.st-step:focus-within{opacity:1;box-shadow:0 6px 24px rgb(0 0 0/.08)}
.st-step h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:4px 0 8px}
.st-step h3{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:4px 0 6px}

.st-step .eyebrow.j1{color:var(--lapis)}.st-step .eyebrow.j2{color:var(--g-acts)}.st-step .eyebrow.j4{color:var(--g-rev)}
.st-hint{color:var(--muted);font-size:.85rem}
.st-q{margin:10px 0;padding:8px 0 8px 14px;border-left:3px solid var(--gold);font-family:var(--serif,Georgia,serif);font-size:1.02rem;line-height:1.5}
.st-q cite{display:block;margin-top:4px;font:normal .72rem var(--mono);color:var(--muted)}
.st-x h2{font-family:var(--display);font-weight:400;font-size:2.2rem;margin:4px 0 8px}
.st-lead{font-size:1.02rem;line-height:1.55;max-width:68ch}
.st-fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;margin:14px 0}
.st-slider{display:flex;gap:10px;align-items:center;font-weight:600;font-size:.88rem}
.st-slider input{flex:1;accent-color:var(--gold);min-height:28px}
.st-units{display:flex;flex-wrap:wrap;gap:6px}
.st-units .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.st-card-now{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:200px}
.st-card-now h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:4px 0 6px}
.st-card-now p{margin:0;line-height:1.5}
.tb-plan,.tb-side{width:100%;height:auto;display:block}
.tb-plan{max-height:min(52vh,560px)}.tb-side{max-height:150px}
.tb-ground{fill:var(--bg)}

.tb-gate{stroke:var(--g-rev);stroke-width:7}
.tb-tent{fill:var(--surface);stroke:var(--gold);stroke-width:3;transition:fill .4s}
.tb-most{fill:var(--surface);stroke:var(--gold);stroke-width:3;transition:fill .4s}
.tb-veil{stroke:var(--g-rev);stroke-width:4}

.tb-item.on{fill:var(--g-rev)}

<script>
(async function(){
const $=s=>document.querySelector(s);
const root=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const GENRES=[[0,4,'--g-law','Law'],[5,16,'--g-hist','History'],[17,21,'--g-poet','Poetry & Wisdom'],[22,26,'--g-maj','Major Prophets'],[27,38,'--g-min','Minor Prophets'],[39,42,'--g-gosp','Gospels'],[43,43,'--g-acts','Acts'],[44,56,'--g-paul','Pauline Letters'],[57,64,'--g-gen','General Letters'],[65,65,'--g-rev','Revelation']];
const genreOf=b=>GENRES.findIndex(g=>b>=g[0]&&b<=g[1]);
const gvar=b=>GENRES[genreOf(b)][2];
const css=v=>getComputedStyle(root).getPropertyValue(v).trim();
const fmt=n=>n.toLocaleString('en-US');
const NATIVE=window.SelahNative||null;
const haptic=()=>{try{if(NATIVE)return NATIVE.haptic();navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Per-viewer memory (adaptation) ----------
const KEY='selah-proto-v1';
let mem={read:{},dwell:[0,0,0,0,0],last:null};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.read)mem=Object.assign(mem,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}};

// ---------- Data ----------
let data,xr;
try{[data,xr]=await Promise.all([fetch('bible.json').then(r=>r.json()),fetch('xref.json').then(r=>r.json())]);}
catch(e){$('#loading').textContent='The Bible text could not be loaded. Reload the page to try again.';return;}
const NAMES=data.names,T=data.text;
T.forEach(chs=>chs.forEach(vs=>vs.forEach((t,i)=>{vs[i]=t.replace(/\s+([,;:.?!)])/g,'$1').replace(/\(\s+/g,'(');})));
const SHORT=["Gen","Exod","Lev","Num","Deut","Josh","Judg","Ruth","1 Sam","2 Sam","1 Kgs","2 Kgs","1 Chr","2 Chr","Ezra","Neh","Esth","Job","Ps","Prov","Eccl","Song","Isa","Jer","Lam","Ezek","Dan","Hos","Joel","Amos","Obad","Jonah","Mic","Nah","Hab","Zeph","Hag","Zech","Mal","Matt","Mark","Luke","John","Acts","Rom","1 Cor","2 Cor","Gal","Eph","Phil","Col","1 Thess","2 Thess","1 Tim","2 Tim","Titus","Phlm","Heb","Jas","1 Pet","2 Pet","1 John","2 John","3 John","Jude","Rev"];
const flat=[],VB=[],VC=[],VV=[],bookStart=[],chapStart=[],bookLen=[];
T.forEach((chs,b)=>{bookStart[b]=flat.length;chapStart[b]=[];chs.forEach((vs,c)=>{chapStart[b][c]=flat.length;vs.forEach((t,v)=>{flat.push(t);VB.push(b);VC.push(c);VV.push(v);});});bookLen[b]=flat.length-bookStart[b];});
const N=flat.length;
const ref=i=>`${SHORT[VB[i]]} ${VC[i]+1}:${VV[i]+1}`;
// ---------- Translations (public domain): the KJV ships with the page, the others load on demand ----------
const TRANSLATIONS=[['kjv','King James Version','KJV'],['web','World English Bible','WEB'],['bsb','Berean Standard Bible','BSB'],['asv','American Standard Version','ASV']];
const trCache={kjv:T.map(b=>b.map(c=>c.slice()))};
let tr='kjv';
const trInfo=id=>TRANSLATIONS.find(t=>t[0]===(id||tr));
function loadTr(id){return trCache[id]?Promise.resolve(trCache[id]):fetch(`tr/${id}.json`).then(r=>{if(!r.ok)throw new Error('missing');return r.json();}).then(d=>trCache[id]=d.text);}
const trText=(txt,b,c,v,id)=>txt[b][c][v]||`[This verse is not in the ${trInfo(id)[2]} text.]`;
async function setTranslation(id){const txt=await loadTr(id);tr=id;let k=0;
  txt.forEach((chs,b)=>chs.forEach((vs,c)=>vs.forEach((_,v)=>{const t=trText(txt,b,c,v,id);T[b][c][v]=t;flat[k++]=t;})));
  mem.tr=id;save();}
const trSelect=()=>`<select class="trsel" aria-label="Translation">${TRANSLATIONS.map(([id,name,ab])=>`<option value="${id}" ${id===tr?'selected':''}>${ab} · ${name}</option>`).join('')}</select>`;
document.addEventListener('change',async e=>{if(!e.target.classList||!e.target.classList.contains('trsel'))return;const id=e.target.value;stopReader();
  try{await setTranslation(id);}catch(_){toast('That translation could not be loaded. Check your connection.');return;}
  go({...state},null,'none');announce(`Now reading the ${trInfo()[1]}.`);});
if(mem.tr&&mem.tr!=='kjv'){try{await setTranslation(mem.tr);}catch(_){}}

// Cross-reference index (from-verse -> list), sorted by votes
const XN=xr.length/3,off=new Uint32Array(N+1);
for(let k=0;k<XN;k++)off[xr[k*3]+1]++;
for(let i=0;i<N;i++)off[i+1]+=off[i];
const xto=new Uint32Array(XN),xv=new Uint16Array(XN),fill=off.slice(0,N);
for(let k=0;k<XN;k++){const f=xr[k*3],p=fill[f]++;xto[p]=xr[k*3+1];xv[p]=xr[k*3+2];}
const xrefsOf=i=>{const a=[];for(let p=off[i];p<off[i+1];p++)a.push([xto[p],xv[p]]);return a.sort((x,y)=>y[1]-x[1]);};
const xcount=i=>off[i+1]-off[i];

// ---------- Sound ----------
let actx=null,soundOn=false,noiseBuf;
function initAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.4,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);}
function posTone(i,depth){ // pitch follows place in canon, brightness follows zoom depth
  if(!soundOn||!actx)return;scapeFollow(i);}
function tick(freq){haptic();if(!soundOn||!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.1,actx.currentTime+0.015);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.5);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+0.55);}
function whoosh(vel){if(!soundOn||!actx||vel<0.2)return;const s=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=400+vel*1600;
  g.gain.value=Math.min(0.12,vel*0.05);s.connect(f).connect(g).connect(actx.destination);s.start();}

// ---------- Soundscape: a slow generative pad and distant bells. The key follows the part of the Bible you are in,
// it thins out as you zoom closer to the text, and it ducks while read-aloud is speaking ----------
// [root (Hz), mode intervals in semitones] per genre: Law, History, Poetry, Major, Minor Prophets, Gospels, Acts, Paul, General, Revelation
const SCAPE_KEYS=[[146.83,[0,2,3,5,7,9,10]],[130.81,[0,2,4,5,7,9,10]],[174.61,[0,2,4,6,7,9,11]],[110.0,[0,2,3,5,7,8,10]],[123.47,[0,2,3,5,7,8,10]],
  [130.81,[0,2,4,5,7,9,11]],[146.83,[0,2,4,5,7,9,11]],[164.81,[0,2,4,5,7,9,11]],[155.56,[0,2,4,5,7,9,11]],[138.59,[0,1,4,5,7,8,10]]];
const PROG=[0,5,3,4,0,3,5,4];
let scape=null,scapeKey=0;
function impulse(sec){const n=actx.sampleRate*sec,b=actx.createBuffer(2,n,actx.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);}return b;}
const noteOf=(key,deg,oct)=>{const [root,mode]=SCAPE_KEYS[key];const st=mode[((deg%7)+7)%7]+12*(oct+Math.floor(deg/7));return root*Math.pow(2,st/12);};
function startScape(){if(scape||!actx)return;const t=actx.currentTime;
  const out=actx.createGain();out.gain.value=0;out.connect(actx.destination);
  const rev=actx.createConvolver();rev.buffer=impulse(4);const wet=actx.createGain();wet.gain.value=.7;rev.connect(wet).connect(out);
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;lp.Q.value=.4;const dry=actx.createGain();dry.gain.value=.45;lp.connect(dry).connect(out);lp.connect(rev);
  const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.04;lg.gain.value=320;lfo.connect(lg).connect(lp.frequency);lfo.start();
  const voices=[0,1,2,3].map(k=>{const o=actx.createOscillator(),g=actx.createGain(),pan=actx.createStereoPanner?actx.createStereoPanner():null;o.type=k===0?'sine':'triangle';o.detune.value=(k-1.5)*6;g.gain.value=0;
    if(pan){pan.pan.value=(k-1.5)*.45;o.connect(g).connect(pan).connect(lp);}else o.connect(g).connect(lp);o.start();return {o,g};});
  scape={out,rev,lp,lfo,voices,step:0,timers:[]};out.gain.setTargetAtTime(.06,t,2.5);
  chord();scape.timers.push(setInterval(chord,9000));bellLoop();}
function chord(){if(!scape)return;const t=actx.currentTime,deg=PROG[scape.step++%PROG.length];
  const notes=[noteOf(scapeKey,deg,-1),noteOf(scapeKey,deg,0),noteOf(scapeKey,deg+2,0),noteOf(scapeKey,deg+4,0)];
  scape.voices.forEach((v,k)=>{v.o.frequency.setTargetAtTime(notes[k],t,1.6);v.g.gain.cancelScheduledValues(t);v.g.gain.setTargetAtTime(k===0?.5:.22+Math.random()*.12,t,2.2);});
  const depth=state.level,calm=mode==='zoom'?depth:1;scape.lp.frequency.setTargetAtTime(1100-calm*130,t,3);
  scape.out.gain.setTargetAtTime(reader.on?.018:.06-calm*.006,t,1.2);}
function bellLoop(){if(!scape)return;const gap=4000+Math.random()*7000+(mode==='zoom'?state.level*1800:0);
  scape.timers.push(setTimeout(()=>{bell();bellLoop();},gap));}
function bell(){if(!scape||reader.on)return;const t=actx.currentTime,PENTA=[0,1,2,4,5];const f=noteOf(scapeKey,PENTA[Math.floor(Math.random()*5)],2);
  const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();o.type='sine';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.76;
  const g2=actx.createGain();g2.gain.value=.18;o2.connect(g2).connect(g);o.connect(g);g.connect(scape.rev);g.connect(scape.lp);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+4.5);o.start(t);o2.start(t);o.stop(t+4.6);o2.stop(t+4.6);}

  setTimeout(()=>{s0.voices.forEach(v=>v.o.stop());s0.lfo.stop();s0.out.disconnect();},4000);}

$('#sound').onclick=()=>{initAudio();soundOn=!soundOn;const b=$('#sound');b.textContent=soundOn?'Soundscape on':'Sound off';b.setAttribute('aria-pressed',soundOn);
  if(actx){actx.resume&&actx.resume();if(soundOn){scapeFollow(curIndex());startScape();}else stopScape();}
  announce(soundOn?'Soundscape on.':'Sound off.');
  if(soundOn){posTone(curIndex(),state.level);tick(523);}};


// ---------- Screen reader announcements and focus ----------
const live=$('#live');
function announce(t){live.textContent='';setTimeout(()=>live.textContent=t,30);}
function describe(){const s=state;if(s.level===0)return 'The whole Bible. 66 books.';if(s.level===1)return `${NAMES[s.b]}. ${T[s.b].length} chapters.`;

  if(s.level===3)return `${NAMES[s.b]} ${s.c+1}:${s.v+1}. ${T[s.b][s.c][s.v]}`;return s.strong?`Original word ${s.tr||''}, meaning ${s.gl||''}.`:`The word ${s.word}.`;}

// ---------- Zoom state ----------

const stage=$('#stage');
const curIndex=()=>state.level===0?0:state.level===1?bookStart[state.b]:state.level===2?chapStart[state.b][state.c]:chapStart[state.b][state.c]+state.v;
const LEVEL_TONE=[262,330,392,494,587];

function crumbs(){const c=$('#crumbs');const parts=[['The Bible',{level:0}]];

  if(state.level>=3)parts.push([`Verse ${state.v+1}`,{level:3,b:state.b,c:state.c,v:state.v}]);
  if(state.level>=4)parts.push([state.strong?`${state.form} · ${state.strong}`:`“${state.word}”`,{...state}]);
  c.innerHTML='';parts.forEach(([t,s],i)=>{if(i){const sp=document.createElement('span');sp.className='sep';sp.textContent='›';c.appendChild(sp);}
    const b=document.createElement('button');b.textContent=t;b.onclick=()=>go(s,null,s.level<state.level?-1:0);c.appendChild(b);});}

function go(next,originEl,dir){
  const prevLevel=state.level;state=Object.assign({level:0,b:0,c:0,v:0,word:null},next);
  if(dir===undefined)dir=state.level>prevLevel?1:state.level<prevLevel?-1:0;
  const el=render();const old=stage.querySelector('.view:not(.leaving)');
  let ox='50%',oy='40%';
  if(originEl){const r=originEl.getBoundingClientRect(),s=stage.getBoundingClientRect();ox=(r.left+r.width/2-s.left)+'px';oy=(r.top+r.height/2-s.top)+'px';}
  stage.appendChild(el);el.style.transformOrigin=`${ox} ${oy}`;
  if(dir==='none'){if(old)old.remove();}
  else{
  if(old){old.classList.add('leaving');old.style.transformOrigin=`${ox} ${oy}`;old.style.pointerEvents='none';

  s.innerHTML=`<button class="x" data-a="close" aria-label="Close">×</button><span class="eyebrow">Search by meaning</span><h2>What are you looking for?</h2>
    <form class="semform" role="search"><label class="sr-only" for="semQ">Describe what you are looking for</label><input id="semQ" type="search" autocomplete="off" placeholder="Try: when I feel anxious" value="${esc(prefill??semQ)}"><button class="btn primary">Search</button></form>
    <div class="semscope" role="group" aria-label="Where to search">${[['all','Whole Bible'],['ot','Old Testament'],['nt','New Testament'],...(cur!=null?[['book',NAMES[cur]]]:[])].map(([k,l])=>`<button type="button" data-scope="${k}" aria-pressed="${semScope===k}">${esc(l)}</button>`).join('')}</div>
    <p class="semstatus" id="semStatus" role="status"></p><ul class="liblist" id="semList"></ul>
    <p class="semnote">Works offline on this device. It finds verses by meaning, not just matching words, so results can surprise you. Read each one in its context.</p>`;
  const inp=s.querySelector('#semQ'),list=s.querySelector('#semList'),st=s.querySelector('#semStatus');
  const examples=()=>{list.innerHTML='';st.textContent='';list.insertAdjacentHTML('beforeend',`<li class="semex">${SEM_EX.map(e=>`<button type="button" class="chip" data-ex="${esc(e)}">${esc(e)}</button>`).join('')}</li>`);};
  async function run(){const q=inp.value.trim();semQ=q;if(!q){examples();return;}
    if(!sem){st.textContent='Getting search ready (about 12 MB, only the first time)…';try{await semLoad();}catch(e){st.textContent='Search could not load. Check your connection and try again.';return;}}
    if(sheetEl!==bg)return;
    const scope=semScope==='ot'?[0,bookStart[39]]:semScope==='nt'?[bookStart[39],N]:semScope==='book'&&cur!=null?[bookStart[cur],bookStart[cur]+bookLen[cur]]:[0,N];
    const t0=performance.now(),res=semSearch(q,scope);
    if(!res.length){list.innerHTML='';st.textContent='No results. Try describing it in other words.';return;}
    st.textContent=`${res.length} verses that match “${q}” best.`;
    list.innerHTML=res.map(([sc,i])=>`<li><button data-to="${i}"><b>${NAMES[VB[i]]} ${VC[i]+1}:${VV[i]+1}</b><span>${esc(flat[i])}</span></button></li>`).join('');
    console.debug('semantic search',Math.round(performance.now()-t0)+'ms');}
  s.querySelector('form').onsubmit=e=>{e.preventDefault();run();};
  bg.addEventListener('click',e=>{if(e.target===bg)return closeSheet();const t=e.target.closest('button');if(!t)return;
    if(t.dataset.a==='close')return closeSheet();
    if(t.dataset.ex){inp.value=t.dataset.ex;run();return;}
    if(t.dataset.scope){semScope=t.dataset.scope;s.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',b===t));if(inp.value.trim())run();return;}
    if(t.dataset.to){const k=+t.dataset.to;closeSheet();setMode('zoom');go({level:3,b:VB[k],c:VC[k],v:VV[k]},null,1);}});
  inp.focus();if(inp.value.trim())run();else examples();semLoad().catch(()=>{});}
$('#findChip').onclick=()=>openSearch();$('#findFab').onclick=()=>openSearch();
addEventListener('keydown',e=>{if(e.key==='/'&&!sheetEl&&!e.target.closest('input,textarea,select,[contenteditable]')){e.preventDefault();openSearch();}});

// ---------- Reading plan: daily or weekly portions that pop up when the app opens ----------
const DAY=864e5,MIN_WPM=180,WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const today=()=>{const d=new Date();return Math.round(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/DAY);};
const chRange=(b0,b1)=>{const a=[];for(let b=b0;b<=b1;b++)T[b].forEach((_,c)=>a.push([b,c]));return a;};
const PLANS=[
  {id:'bible',name:'Whole Bible in a year',sub:'Genesis to Revelation',ch:()=>chRange(0,65),daily:365,weekly:52},
  {id:'nt',name:'New Testament in 3 months',sub:'Matthew to Revelation',ch:()=>chRange(39,65),daily:90,weekly:13},
  {id:'gospels',name:'The Gospels in a month',sub:'Matthew, Mark, Luke and John',ch:()=>chRange(39,42),daily:30,weekly:4},
  {id:'wisdom',name:'Psalms and Proverbs',sub:'One psalm or proverb at a time',ch:()=>chRange(18,19),daily:181,weekly:26}];
const wordsOf=(b,c)=>T[b][c].reduce((a,t)=>a+t.split(' ').length,0);
const mins=ch=>Math.max(1,Math.round(ch.reduce((a,[b,c])=>a+wordsOf(b,c),0)/MIN_WPM));
const pcache={};
// Split a plan into n portions of roughly equal reading time, keeping chapters whole
function portions(id,cad){const k=id+cad;if(pcache[k])return pcache[k];const p=PLANS.find(x=>x.id===id),n=p[cad],ch=p.ch(),w=ch.map(([b,c])=>wordsOf(b,c)),tot=w.reduce((a,x)=>a+x,0);
  const out=[];let i=0,acc=0;
  for(let k=0;k<n&&i<ch.length;k++){const target=tot*(k+1)/n,cur=[];
    while(i<ch.length&&(k===n-1||cur.length===0||(acc+w[i]/2<=target&&ch.length-i>n-k-1))){cur.push(ch[i]);acc+=w[i];i++;}
    out.push(cur);}
  return pcache[k]=out;}
const P=()=>mem.plan;
const unit=()=>P().cad==='daily'?'day':'week';
const isRead=([b,c])=>!!P().read[b+'.'+c];
function curIdx(){const ps=portions(P().id,P().cad);const i=ps.findIndex(p=>!p.every(isRead));return i<0?ps.length:i;}
const schedIdx=()=>Math.floor((today()-P().start)/(P().cad==='daily'?1:7));
const periodNow=()=>P().cad==='daily'?today():Math.floor((today()-P().start)/7);
const doneThisPeriod=()=>!!P().log[periodNow()];
function streak(){const L=P().log;let s=0,t=periodNow();if(!L[t])t--;while(L[t]){s++;t--;}return s;}
function inPlan(b,c){if(!P())return -1;const ps=portions(P().id,P().cad);for(let i=0;i<ps.length;i++)if(ps[i].some(x=>x[0]===b&&x[1]===c))return i;return -1;}
function planChip(){const ch=$('#planChip');if(!P()){ch.textContent='Reading plan';ch.classList.add('due');return;}
  const ps=portions(P().id,P().cad),i=curIdx();if(i>=ps.length){ch.textContent='Plan complete';ch.classList.remove('due');return;}
  const p=ps[i],r=p.filter(isRead).length,d=doneThisPeriod();
  ch.textContent=d?`${unit()==='day'?'Today':'This week'} done · ${streak()} ${unit()} streak`:`${unit()==='day'?'Today':'This week'} · ${r}/${p.length}`;ch.classList.toggle('due',!d);}
// Mark a chapter read for the plan; returns true if this finished the current portion
function planMark(b,c){if(!P()||inPlan(b,c)<0||P().read[b+'.'+c])return false;const before=curIdx();P().read[b+'.'+c]=1;mem.read[b+'.'+c]=1;
  const after=curIdx(),fin=after>before;if(fin){const first=!doneThisPeriod();P().log[periodNow()]=1;save();planChip();refreshPlanBar();if(first)setTimeout(()=>openSheet('done'),reader.on?0:400);return true;}
  save();planChip();refreshPlanBar();return false;}
function planBarHTML(b,c){if(!P())return '';const i=inPlan(b,c);if(i<0||i!==curIdx())return '';const p=portions(P().id,P().cad)[i],k=p.findIndex(x=>x[0]===b&&x[1]===c),rd=P().read[b+'.'+c];
  return `<div class="planbar" id="planbar"><span><b>${unit()==='day'?"Today's":"This week's"} reading</b> · ${k+1} of ${p.length}</span><span class="pd">${p.map(x=>`<i class="${isRead(x)?'on':''}"></i>`).join('')}</span>${rd?'<span>Read ✓</span>':`<button class="btn" data-plan="mark" data-pc="${b},${c}">${p.filter(x=>!isRead(x)).length>1?'Mark read · next →':'Mark read · finish'}</button>`}</div>`;}
function refreshPlanBar(){const el=document.getElementById('planbar');if(!el)return;const h=planBarHTML(state.b,state.c);if(!h){el.remove();return;}el.outerHTML=h;}
function firstUnread(){const ps=portions(P().id,P().cad),i=curIdx();return i<ps.length?ps[i].find(x=>!isRead(x)):null;}
function openReading(listen){closeSheet();const x=firstUnread();if(!x)return;const [b,c]=x;setMode('zoom');
  if(state.level===2&&state.b===b&&state.c===c){if(listen)startReader(0);return;}
  go({level:2,b,c},null,1);if(listen)setTimeout(()=>startReader(0),900);}
function calLink(){const p=P(),t=p.time||'07:30',[hh,mm]=t.split(':');const d=new Date();if(p.cad==='weekly'){d.setDate(d.getDate()+((p.day-d.getDay()+7)%7));}
  const ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`,end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+hh,+mm+15);
  const e=`${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}T${String(end.getHours()).padStart(2,'0')}${String(end.getMinutes()).padStart(2,'0')}00`;
  const rr=p.cad==='daily'?'RRULE:FREQ=DAILY':`RRULE:FREQ=WEEKLY;BYDAY=${['SU','MO','TU','WE','TH','FR','SA'][p.day]}`;
  const q=new URLSearchParams({action:'TEMPLATE',text:`Selah · ${p.cad==='daily'?"Today's":"This week's"} Bible reading`,details:`${PLANS.find(x=>x.id===p.id).name}. Open Selah: https://claude.ai/artifact/77SgtT9NKssJgPLQEqevr1`,dates:`${ymd}T${hh}${mm}00/${e}`,recur:rr});
  try{q.set('ctz',Intl.DateTimeFormat().resolvedOptions().timeZone)}catch(_){}
  return 'https://calendar.google.com/calendar/render?'+q.toString();}
let sheetEl=null,pick={cad:'daily',id:'bible',day:0,time:'07:30'};
function closeSheet(){if(sheetEl){const r=sheetEl._restore;sheetEl.remove();sheetEl=null;r&&r();}}
function openSheet(view){closeSheet();const bg=document.createElement('div');bg.className='sheetbg';bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');
  const s=document.createElement('div');s.className='sheet';bg.appendChild(s);document.body.appendChild(bg);sheetEl=bg;trapFocus(bg);
  bg.addEventListener('click',e=>{if(e.target===bg)later();});
  const paint=v=>{view=v;s.innerHTML=v==='pick'?pickHTML():v==='done'?doneHTML():todayHTML();bg.setAttribute('aria-label',v==='pick'?'Choose a reading plan':'Reading plan');const f=s.querySelector('.primary');f&&f.focus({preventScroll:true});};
  s.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;const a=t.dataset.a;if(!a)return;if(t.tagName==='A'&&a==='cal')return;e.preventDefault();haptic();
    if(a==='close')later();else if(a==='skip'){P().snooze=today()+1;save();closeSheet();toast(`Okay, the plan will pop up again ${P().cad==='daily'?'tomorrow':'tomorrow if this week is still open'}.`);}
    else if(a==='read')openReading(false);else if(a==='listen')openReading(true);
    else if(a==='ch'){closeSheet();const [b,c]=t.dataset.pc.split(',').map(Number);setMode('zoom');go({level:2,b,c},null,1);}
    else if(a==='change'){if(P())pick={cad:P().cad,id:P().id,day:P().day,time:P().time};paint('pick');}
    else if(a==='cad'){pick.cad=t.dataset.v;paint('pick');}else if(a==='plan'){pick.id=t.dataset.v;paint('pick');}
    else if(a==='start'){const keep=P()&&P().id===pick.id?P().read:{};mem.plan={id:pick.id,cad:pick.cad,day:pick.day,time:pick.time,start:today(),read:keep,log:{},snooze:0};
      save();NATIVE&&NATIVE.scheduleReminders(mem.plan);planChip();refreshPlanBar();tick(523);setTimeout(()=>tick(659),90);paint('today');}
    else if(a==='notnow'){mem.planAsk=today()+3;save();closeSheet();toast('You can start a reading plan any time from the chip at the top.');}
    else if(a==='today')paint('today');});
  s.addEventListener('change',e=>{if(e.target.id==='pday')pick.day=+e.target.value;if(e.target.id==='ptime')pick.time=e.target.value;
    if(P()&&view==='today'&&e.target.id==='ptime2'){P().time=e.target.value;save();if(NATIVE)NATIVE.scheduleReminders(P());else s.querySelector('[data-a="cal"]').href=calLink();}});
  paint(view);}
function later(){if(P()){P().snoozeUntil=Date.now()+3*36e5;save();}closeSheet();}
addEventListener('keydown',e=>{if(sheetEl&&e.key==='Escape'){e.stopImmediatePropagation();sheetEl._esc?sheetEl._esc():later();}},true);
function pickHTML(){const n=c=>c==='daily'?'day':'week';
  return `<button class="x" data-a="close" aria-label="Close">×</button><span class="eyebrow">Reading plan</span><h2>Read the Bible a little at a time</h2>
  <p>Pick a pace that fits a busy life. Each time you open Selah it shows ${pick.cad==='daily'?"today's":"this week's"} portion, how long it takes, and your streak. If you miss a ${n(pick.cad)}, it picks up where you left off, so nothing is skipped.</p>
  <div class="cad" role="group" aria-label="Pace"><button data-a="cad" data-v="daily" aria-pressed="${pick.cad==='daily'}">Daily</button><button data-a="cad" data-v="weekly" aria-pressed="${pick.cad==='weekly'}">Weekly</button></div>
  <div class="pplans">${PLANS.map(p=>{const ps=portions(p.id,pick.cad),avg=Math.round(ps.reduce((a,x)=>a+mins(x),0)/ps.length),chs=ps.reduce((a,x)=>a+x.length,0)/ps.length;
    return `<button data-a="plan" data-v="${p.id}" aria-pressed="${pick.id===p.id}"><b>${p.name}</b><span>${p.sub} · ${p[pick.cad]} ${n(pick.cad)}s · about ${avg} min a ${n(pick.cad)} · ${chs<1.5?'1 chapter':`${Math.floor(chs)}–${Math.ceil(chs)} chapters`}</span></button>`;}).join('')}</div>
  <div class="prow">${pick.cad==='weekly'?`<label>Reading day <select id="pday">${WD.map((d,i)=>`<option value="${i}" ${i===pick.day?'selected':''}>${d}</option>`).join('')}</select></label>`:''}<label>Reminder time <input type="time" id="ptime" value="${pick.time}"></label></div>
  <div class="pacts"><button class="btn primary" data-a="start">${P()?'Switch to this plan':'Start plan'}</button>${P()?'<button class="btn" data-a="today">Back</button>':'<button class="btn" data-a="notnow">Not now</button>'}</div>`;}
function todayHTML(){const p=P(),pl=PLANS.find(x=>x.id===p.id),ps=portions(p.id,p.cad),i=curIdx(),u=unit();
  if(i>=ps.length)return `<button class="x" data-a="close" aria-label="Close">×</button><div class="cele">🎉</div><h2>You finished ${pl.name.toLowerCase()}</h2><p>Every portion is read. Start another plan whenever you are ready.</p><div class="pacts"><button class="btn primary" data-a="change">Choose a new plan</button></div>`;
  const por=ps[i],rd=por.filter(isRead).length,behind=schedIdx()-i,tot=ps.reduce((a,x)=>a+x.length,0),readAll=ps.slice(0,i).reduce((a,x)=>a+x.length,0)+rd,st=streak(),d=doneThisPeriod();
  const left=por.filter(x=>!isRead(x));const wday=p.cad==='weekly'?(new Date().getDay()===p.day?'Today is your reading day. ':`Your reading day is ${WD[p.day]}. `):'';
  return `<button class="x" data-a="close" aria-label="Close">×</button><span class="eyebrow">${u==='day'?'Day':'Week'} ${i+1} of ${ps.length} · ${pl.name}</span>
  <h2>${d?(u==='day'?'Done for today. Read ahead?':'Done for this week. Read ahead?'):(u==='day'?"Today's reading":"This week's reading")}</h2>
  <p>${wday}About ${mins(left.length?left:por)} minute${mins(left.length?left:por)>1?'s':''} ${left.length&&rd?'left':'to read'}${p.cad==='weekly'?`, or about ${Math.ceil(mins(left.length?left:por)/7)} minutes a day across the week`:''}. You can also listen instead.</p>
  <ul class="plist${por.length>6?' compact':''}">${por.map(([b,c])=>`<li><button data-a="ch" data-pc="${b},${c}" class="${isRead([b,c])?'done':''}" style="--c:var(${gvar(b)})"><span class="ck">${isRead([b,c])?'✓':''}</span><span class="pn">${NAMES[b]} ${c+1}</span><small>${T[b][c].length} vv · ${mins([[b,c]])} min</small></button></li>`).join('')}</ul>
  <div class="pstats"><span class="fire">${st?`🔥 ${st}-${u} streak`:'Start a streak today'}</span><span>${behind>0?`${behind} ${u}${behind>1?'s':''} behind, no rush`:behind<0?`${-behind} ${u}${behind<-1?'s':''} ahead`:'On track'}</span></div>
  <div class="pbar"><i style="width:${(readAll/tot*100).toFixed(1)}%"></i></div><div class="pmeta">${fmt(readAll)} of ${fmt(tot)} chapters · ${Math.round(readAll/tot*100)}%</div>
  <div class="pacts"><button class="btn primary" data-a="read">${rd?'Continue reading':'Read now'}</button><button class="btn" data-a="listen">▶ Listen</button><button class="btn" data-a="close">Later</button>${d?'':`<button class="btn" data-a="skip">Skip ${u==='day'?'today':'for today'}</button>`}</div>
  <div class="plinks">${NATIVE?`<span style="font-size:.82rem;color:var(--muted)">${p.cad==='daily'?'Daily':WD[p.day]+''} reminder on this device</span> `:`<a data-a="cal" href="${calLink()}" target="_blank" rel="noopener">Add a ${p.cad} reminder to Google Calendar</a>`}<label style="font-size:.82rem;color:var(--muted)">at <input type="time" id="ptime2" value="${p.time||'07:30'}" style="font:inherit;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:var(--surface);color:var(--ink)"></label><button data-a="change">Change plan</button></div>`;}
function doneHTML(){const u=unit(),st=streak();tick(523);setTimeout(()=>tick(659),110);setTimeout(()=>tick(784),220);haptic();
  return `<button class="x" data-a="close" aria-label="Close">×</button><div class="cele">${st>=7?'🔥':'✨'}</div><h2>${u==='day'?"Today's reading is done":"This week's reading is done"}</h2>
  <p>${st>1?`That is a ${st}-${u} streak. `:''}See you ${u==='day'?'tomorrow':'next week'}. The next portion is ready if you want to keep going.</p>
  <div class="pacts"><button class="btn primary" data-a="close">Close</button><button class="btn" data-a="today">See what's next</button></div>`;}
// Pop up on open: today's (or this week's) portion if it isn't done yet, or an invitation to start a plan
function planOnOpen(){if(!P()){if((mem.planAsk||0)<=today())openSheet('pick');return;}
  if(curIdx()>=portions(P().id,P().cad).length||doneThisPeriod())return;
  if((P().snooze||0)>today()||(P().snoozeUntil||0)>Date.now())return;
  openSheet('today');}
$('#planChip').onclick=()=>openSheet(P()?'today':'pick');
document.addEventListener('click',e=>{const t=e.target.closest('[data-plan="mark"]');if(!t)return;e.stopPropagation();haptic();tick(587);const [b,c]=t.dataset.pc.split(',').map(Number);
  const fin=planMark(b,c);if(!fin){const x=firstUnread();if(x){setMode('zoom');goChapter(x[0],x[1],1);}}},true);
planChip();if(NATIVE&&P())NATIVE.scheduleReminders(P());
state=Object.assign({level:0,b:0,c:0,v:0,word:null},start);
stage.appendChild(render());crumbs();drawScrub();
setTimeout(planOnOpen,900);
})();
</script>
