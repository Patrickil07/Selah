name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: selah-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  windows:
    name: Windows (Microsoft Store package and installer)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package for Windows
        working-directory: windows
        run: |
          npm ci
          npm run dist
      - name: Check the app opens and shows the Bible
        working-directory: windows
        run: |
          npm install --no-save playwright@1.56.1
          node smoke.mjs dist/win-unpacked/Selah.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selah-windows
          path: |
            windows/dist/*.appx
            windows/dist/*.exe
            windows/dist/smoke.png
      # A direct download for the Store upload, without signing in to GitHub
      - name: Attach the Store package to the Windows release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "windows-$v" >/dev/null 2>&1 || gh release create "windows-$v" --prerelease --target "$GITHUB_SHA" \
            --title "Selah Bible $v for Windows" --notes "Selah-$v.appx is the Microsoft Store package. Selah-Setup-$v.exe installs the app directly."
          gh release upload "windows-$v" dist/Selah-$v.appx dist/Selah-Setup-$v.exe --clobber
