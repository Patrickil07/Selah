name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: selah-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-release:
    name: Android (Play Store bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore the Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret yet, so this bundle is unsigned and can't go to Google Play."
          fi
      - name: Build the release bundle
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../Selah-1.0.0-${{ github.run_number }}.aab"
      - name: Check the bundle is signed
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: jarsigner -verify Selah-*.aab | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: selah-play-bundle
          path: Selah-*.aab
      # A direct download for the Play Console upload, without signing in to GitHub
      - name: Attach the bundle to the Android release
        if: env.ANDROID_KEYSTORE_FILE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-1.0.0 >/dev/null 2>&1 || gh release create android-1.0.0 --prerelease --target "$GITHUB_SHA" \
            --title "Selah Bible 1.0.0 for Android" --notes "The .aab file is the bundle to upload in the Google Play Console. The newest build has the highest number."
          gh release upload android-1.0.0 Selah-*.aab --clobber

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  windows:
    name: Windows (Microsoft Store package and installer)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package for Windows
        working-directory: windows
        run: |
          npm ci
          npm run dist
      - name: Check the app opens and shows the Bible
        working-directory: windows
        run: |
          npm install --no-save playwright@1.56.1
          node smoke.mjs dist/win-unpacked/Selah.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selah-windows
          path: |
            windows/dist/*.appx
            windows/dist/*.exe
            windows/dist/smoke.png
      # A direct download for the Store upload, without signing in to GitHub
      - name: Attach the Store package to the Windows release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "windows-$v" >/dev/null 2>&1 || gh release create "windows-$v" --prerelease --target "$GITHUB_SHA" \
            --title "Selah Bible $v for Windows" --notes "Selah-$v.appx is the Microsoft Store package. Selah-Setup-$v.exe installs the app directly."
          gh release upload "windows-$v" dist/Selah-$v.appx dist/Selah-Setup-$v.exe --clobber
